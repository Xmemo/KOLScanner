[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-qa"
version = "0.1.0"
description = "Signal quality audit toolkit for exported Telegram channel history"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Open Source Signal QA" }]
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.36", "plotly>=5.0"]

[project.scripts]
signal-qa = "signal_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
